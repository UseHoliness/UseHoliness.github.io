    getDoc,
    onSnapshot,
    setDoc,
    runTransaction,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyADRjI5WbLWECkPk9AKDkpnzJQD82fLjFg",

    authDomain:
        "holiness-e6ec3.firebaseapp.com",

    projectId:
        "holiness-e6ec3",

    storageBucket:
        "holiness-e6ec3.firebasestorage.app",

    messagingSenderId:
        "842822716544",

    appId:
        "1:842822716544:web:d24b1835fa9f4289ce2a65",

    measurementId:
        "G-ZTL2W77QFT"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const PRECO = 109.90;

const WHATSAPP = "5533998019698";


/* =====================================================
   ESTOQUE LOCAL
===================================================== */

let estoque = {

    Glory: {

        PP: 3,
        P: 2,
        M: 2,
        G: 3,
        GG: 1,
        XG: 1

    },

    Frassati: {

        PP: 3,
        P: 2,
        M: 2,
        G: 2,
        GG: 0,
        XG: 1

    }

};


/* =====================================================
   CUPONS
===================================================== */

const cupons = {

    GLORY10: 10,

    ALTAR20: 20

};


/* =====================================================
   VARIÁVEIS
===================================================== */

let carrinho = [];

let tamanhosSelecionados = {

    Glory: "",

    Frassati: ""

};

let quantidades = {

    Glory: 1,

    Frassati: 1

};

let descontoAtual = 0;

let cupomAtual = "";

let pagamentoSelecionado = "";


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(valor) {

    return "R$ " +
        Number(valor)
            .toFixed(2)
            .replace(".", ",");

}


/* =====================================================
   CARREGAR ESTOQUE
===================================================== */

async function carregarEstoque() {

    try {

        const gloryRef =
            doc(db, "estoque", "Glory");

        const frassatiRef =
            doc(db, "estoque", "Frassati");


        const glorySnap =
            await getDoc(gloryRef);

        const frassatiSnap =
            await getDoc(frassatiRef);


        if (glorySnap.exists()) {

            estoque.Glory =
                {
                    ...estoque.Glory,
                    ...glorySnap.data()
                };

        }


        if (frassatiSnap.exists()) {

            estoque.Frassati =
                {
                    ...estoque.Frassati,
                    ...frassatiSnap.data()
                };

        }


        atualizarTamanhosDisponiveis();


    } catch (erro) {

        console.error(
            "Erro ao carregar estoque:",
            erro
        );

    }

}


/* =====================================================
   ESTOQUE EM TEMPO REAL
===================================================== */

function observarEstoque() {


    onSnapshot(

        doc(
            db,
            "estoque",
            "Glory"
        ),

        function(snapshot) {

            if (snapshot.exists()) {

                estoque.Glory =
                    {
                        ...estoque.Glory,
                        ...snapshot.data()
                    };

                atualizarTamanhosDisponiveis();

            }

        },

        function(error) {

            console.error(
                "Erro no estoque Glory:",
                error
            );

        }

    );


    onSnapshot(

        doc(
            db,
            "estoque",
            "Frassati"
        ),

        function(snapshot) {

            if (snapshot.exists()) {

                estoque.Frassati =
                    {
                        ...estoque.Frassati,
                        ...snapshot.data()
                    };

                atualizarTamanhosDisponiveis();

            }

        },

        function(error) {

            console.error(
                "Erro no estoque Frassati:",
                error
            );

        }

    );

}


/* =====================================================
   TROCAR IMAGEM
===================================================== */

function trocarImagem(
    idImagem,
    arquivo,
    botao
) {

    document.getElementById(
        idImagem
    ).src = arquivo;


    const produto =
        botao.closest(".product");


    produto
        .querySelectorAll(".thumb")
        .forEach(function(item) {

            item.classList.remove(
                "active"
            );

        });


    botao.classList.add(
        "active"
    );

}


/* =====================================================
   SELECIONAR TAMANHO
===================================================== */

function selecionarTamanho(
    produto,
    tamanho,
    botao
) {

    if (
        !estoque[produto] ||
        !estoque[produto][tamanho] ||
        estoque[produto][tamanho] <= 0
    ) {

        return;

    }


    tamanhosSelecionados[produto] =
        tamanho;


    quantidades[produto] = 1;


    document.getElementById(
        produto + "Quantity"
    ).innerText = "1";


    const container =
        botao.parentElement;


    container
        .querySelectorAll("button")
        .forEach(function(item) {

            item.classList.remove(
                "selected"
            );

        });


    botao.classList.add(
        "selected"
    );


    const texto =
        document.getElementById(
            produto +
            "SelectedSize"
        );


    texto.style.color =
        "#777";


    texto.innerHTML =
        "Tamanho <strong>" +
        tamanho +
        "</strong> — " +
        estoque[produto][tamanho] +
        " disponíveis";

}


/* =====================================================
   ATUALIZAR TAMANHOS
===================================================== */

function atualizarTamanhosDisponiveis() {

    document
        .querySelectorAll(".product")
        .forEach(function(produtoElemento) {

            const nomeProduto =
                produtoElemento
                    .querySelector("h3")
                    .innerText
                    .trim()
                    .toLowerCase();


            let produtoEstoque;


            if (
                nomeProduto === "glory"
            ) {

                produtoEstoque =
                    estoque.Glory;

            }

            else if (
                nomeProduto === "frassati"
            ) {

                produtoEstoque =
                    estoque.Frassati;

            }

            else {

                return;

            }


            const botoes =
                produtoElemento
                    .querySelectorAll(
                        ".sizes button"
                    );


            botoes.forEach(
                function(botao) {

                    const tamanho =
                        botao.innerText
                            .trim()
                            .toUpperCase();


                    if (
                        !produtoEstoque[tamanho] ||
                        produtoEstoque[tamanho] <= 0
                    ) {

                        botao.classList.add(
                            "unavailable"
                        );

                        botao.disabled =
                            true;

                    }

                    else {

                        botao.classList.remove(
                            "unavailable"
                        );

                        botao.disabled =
                            false;

                    }

                }
            );

        });

}


/* =====================================================
   QUANTIDADE
===================================================== */

function alterarQuantidade(
    produto,
    valor
) {

    const tamanho =
        tamanhosSelecionados[produto];


    if (!tamanho) {

        if (valor > 0) {

            alert(
                "Escolha o tamanho primeiro."
            );

        }

        return;

    }


    const estoqueDisponivel =
        estoque[produto][tamanho];


    let novaQuantidade =
        quantidades[produto] +
        valor;


    if (
        novaQuantidade < 1
    ) {

        novaQuantidade = 1;

    }


    if (
        novaQuantidade >
        estoqueDisponivel
    ) {

        novaQuantidade =
            estoqueDisponivel;


        alert(
            "Você atingiu o estoque disponível desse tamanho."
        );

    }


    quantidades[produto] =
        novaQuantidade;


    document.getElementById(
        produto + "Quantity"
    ).innerText =
        novaQuantidade;

}


/* =====================================================
   ADICIONAR PRODUTO
===================================================== */

function adicionarProduto(
    nome,
    imagem
) {

    const tamanho =
        tamanhosSelecionados[nome];


    const quantidade =
        quantidades[nome];


    if (!tamanho) {

        alert(
            "Selecione um tamanho antes de adicionar a camisa."
        );

        return;

    }


    const estoqueDisponivel =
        estoque[nome][tamanho];


    if (
        quantidade >
        estoqueDisponivel
    ) {

        alert(
            "Quantidade maior que o estoque disponível."
        );

        return;

    }


    const existente =
        carrinho.find(
            function(item) {

                return (
                    item.nome === nome &&
                    item.tamanho === tamanho
                );

            }
        );


    if (existente) {

        if (
            existente.quantidade +
            quantidade >
            estoqueDisponivel
        ) {

            alert(
                "Você ultrapassou o estoque disponível."
            );

            return;

        }


        existente.quantidade +=
            quantidade;

    }

    else {

        carrinho.push({

            nome: nome,

            imagem: imagem,

            tamanho: tamanho,

            quantidade: quantidade,

            preco: PRECO

        });

    }


    atualizarCarrinho();

    abrirCarrinho();

}


/* =====================================================
   SUBTOTAL
===================================================== */

function calcularSubtotal() {

    let subtotal = 0;


    carrinho.forEach(
        function(item) {

            subtotal +=
                item.preco *
                item.quantidade;

        }
    );


    return subtotal;

}


/* =====================================================
   TOTAL
===================================================== */

function calcularTotal() {

    const subtotal =
        calcularSubtotal();


    return subtotal -
        (
            subtotal *
            descontoAtual /
            100
        );

}


/* =====================================================
   CUPOM
===================================================== */

function aplicarCupom() {

    const input =
        document.getElementById(
            "couponInput"
        );


    const mensagem =
        document.getElementById(
            "couponMessage"
        );


    const codigo =
        input.value
            .trim()
            .toUpperCase();


    if (!codigo) {

        mensagem.innerText =
            "Digite um cupom.";

        mensagem.style.color =
            "#b00000";

        return;

    }


    if (
        cupons[codigo]
    ) {

        descontoAtual =
            cupons[codigo];

        cupomAtual =
            codigo;


        mensagem.innerText =
            "Cupom aplicado! " +
            descontoAtual +
            "% de desconto.";

        mensagem.style.color =
            "#16833b";


        atualizarCarrinho();

    }

    else {

        descontoAtual = 0;

        cupomAtual = "";


        mensagem.innerText =
            "Cupom inválido.";

        mensagem.style.color =
            "#b00000";


        atualizarCarrinho();

    }

}


/* =====================================================
   ATUALIZAR CARRINHO
===================================================== */

function atualizarCarrinho() {

    const container =
        document.getElementById(
            "cartItems"
        );


    const total =
        document.getElementById(
            "cartTotal"
        );


    const contador =
        document.getElementById(
            "cartCount"
        );


    let quantidadeTotal = 0;


    carrinho.forEach(
        function(item) {

            quantidadeTotal +=
                item.quantidade;

        }
    );


    contador.innerText =
        quantidadeTotal;


    if (
        carrinho.length === 0
    ) {

        container.innerHTML =
            '<div class="empty">' +
            'Seu carrinho está vazio.' +
            '</div>';


        total.innerText =
            dinheiro(0);

        return;

    }


    container.innerHTML = "";


    carrinho.forEach(
        function(item, index) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "cart-item";


            div.innerHTML =

                '<img src="' +
                item.imagem +
                '" alt="' +
                item.nome +
                '">' +

                '<div class="cart-item-info">' +

                '<h3>' +
                item.nome +
                '</h3>' +

                '<p>Tamanho: ' +
                item.tamanho +
                '</p>' +

                '<p>Quantidade: ' +
                item.quantidade +
                '</p>' +

                '<p>' +
                dinheiro(
                    item.preco *
                    item.quantidade
                ) +
                '</p>' +

                '<button class="remove" ' +
                'onclick="removerProduto(' +
                index +
                ')">' +

                'REMOVER' +

                '</button>' +

                '</div>';


            container.appendChild(
                div
            );

        }
    );


    const subtotal =
        calcularSubtotal();


    const totalFinal =
        calcularTotal();


    if (
        descontoAtual > 0
    ) {

        total.innerHTML =

            '<span style="' +
            'font-size:11px;' +
            'color:#999;' +
            'text-decoration:line-through;' +
            'margin-right:7px;">' +

            dinheiro(subtotal) +

            '</span>' +

            dinheiro(totalFinal);

    }

    else {

        total.innerText =
            dinheiro(totalFinal);

    }

}


/* =====================================================
   REMOVER
===================================================== */

function removerProduto(index) {

    carrinho.splice(
        index,
        1
    );


    atualizarCarrinho();

}


/* =====================================================
   CARRINHO
===================================================== */

function abrirCarrinho() {

    document
        .getElementById(
            "cartOverlay"
        )
        .classList.add(
            "active"
        );


    atualizarCarrinho();

}


function fecharCarrinho() {

    document
        .getElementById(
            "cartOverlay"
        )
        .classList.remove(
            "active"
        );

}


function fecharCarrinhoFora(event) {

    if (
        event.target.id ===
        "cartOverlay"
    ) {

        fecharCarrinho();

    }

}


/* =====================================================
   PAGAMENTO
===================================================== */

function selecionarPagamento(
    pagamento,
    botao
) {

    pagamentoSelecionado =
        pagamento;


    document
        .querySelectorAll(
            ".payments button"
        )
        .forEach(
            function(item) {

                item.classList.remove(
                    "selected"
                );

            }
        );


    botao.classList.add(
        "selected"
    );


    document.getElementById(
        "cartError"
    ).innerText = "";

}


/* =====================================================
   GERAR NÚMERO DO PEDIDO
=====================================================

   O contador fica em:

   contador
       └── pedidos
             └── proximoNumero

   Pedidos:

   pedidos
       ├── #001
       ├── #002
       └── #003

===================================================== */

async function gerarNumeroPedido() {

    const contadorRef =
        doc(
            db,
            "contador",
            "pedidos"
        );


    const numero =
        await runTransaction(
            db,
            async function(transaction) {

                const contadorSnap =
                    await transaction.get(
                        contadorRef
                    );


                let proximoNumero = 1;


                if (
                    contadorSnap.exists()
                ) {

                    const dados =
                        contadorSnap.data();


                    const numeroSalvo =
                        Number(
                            dados.proximoNumero
                        );


                    if (
                        Number.isInteger(
                            numeroSalvo
                        ) &&
                        numeroSalvo >= 1
                    ) {

                        proximoNumero =
                            numeroSalvo;

                    }

                }


                transaction.set(
                    contadorRef,
                    {

                        proximoNumero:
                            proximoNumero + 1,

                        atualizadoEm:
                            serverTimestamp()

                    },
                    {
                        merge: true
                    }
                );


                return proximoNumero;

            }
        );


    return "#" +
        String(numero)
            .padStart(3, "0");

}


/* =====================================================
   SALVAR PEDIDO
===================================================== */

async function salvarPedidoFirebase() {

    if (
        carrinho.length === 0
    ) {

        throw new Error(
            "Carrinho vazio."
        );

    }


    /*
     * Primeiro montamos todos os dados
     * do pedido.
     */

    const subtotal =
        calcularSubtotal();


    const total =
        calcularTotal();


    const itens =
        carrinho.map(
            function(item) {

                return {

                    produto:
                        item.nome,

                    tamanho:
                        item.tamanho,

                    quantidade:
                        Number(
                            item.quantidade
                        ),

                    precoUnitario:
                        Number(
                            item.preco
                        ),

                    subtotal:
                        Number(
                            (
                                item.preco *
                                item.quantidade
                            ).toFixed(2)
                        )

                };

            }
        );


    /*
     * Geramos o número progressivo.
     */

    const numeroPedido =
        await gerarNumeroPedido();


    /*
     * O próprio número é o ID
     * do documento.
     */

    const pedidoRef =
        doc(
            db,
            "pedidos",
            numeroPedido
        );


    const pedido = {

        numeroPedido:
            numeroPedido,

        itens:
            itens,

        subtotal:
            Number(
                subtotal.toFixed(2)
            ),

        desconto:
            Number(
                descontoAtual
            ),

        cupom:
            cupomAtual || null,

        total:
            Number(
                total.toFixed(2)
            ),

        pagamento:
            pagamentoSelecionado,

        status:
            "aguardando_confirmacao",

        criadoEm:
            serverTimestamp()

    };


    /*
     * Salva o pedido.
     */

    await setDoc(
        pedidoRef,
        pedido
    );


    console.log(
        "PEDIDO REGISTRADO:",
        numeroPedido
    );


    return numeroPedido;

}


/* =====================================================
   FINALIZAR COMPRA
===================================================== */

async function finalizarCompra() {

    const erro =
        document.getElementById(
            "cartError"
        );


    erro.style.color =
        "#777";

    erro.innerText =
        "";


    /* =================================================
       VALIDAÇÕES
    ================================================= */

    if (
        carrinho.length === 0
    ) {

        erro.style.color =
            "#b00000";

        erro.innerText =
            "Seu carrinho está vazio.";

        return;

    }


    if (
        pagamentoSelecionado === ""
    ) {

        erro.style.color =
            "#b00000";

        erro.innerText =
            "Selecione um método de pagamento.";

        return;

    }


    /*
     * Evita clique duplo.
     */

    const botaoCheckout =
        document.querySelector(
            ".checkout"
        );


    if (
        botaoCheckout.disabled
    ) {

        return;

    }


    botaoCheckout.disabled =
        true;


    const textoOriginal =
        botaoCheckout.innerText;


    botaoCheckout.innerText =
        "REGISTRANDO PEDIDO...";


    /* =================================================
       SALVAR NO FIREBASE
    ================================================= */

    let pedidoId;


    try {

        erro.style.color =
            "#777";

        erro.innerText =
            "Registrando seu pedido...";


        pedidoId =
            await salvarPedidoFirebase();


        console.log(
            "Pedido registrado:",
            pedidoId
        );


    } catch (firebaseErro) {

        console.error(
            "ERRO AO REGISTRAR PEDIDO:",
            firebaseErro
        );


        botaoCheckout.disabled =
            false;


        botaoCheckout.innerText =
            textoOriginal;


        erro.style.color =
            "#b00000";


        /*
         * Mostra uma mensagem mais útil
         * no console.
         */

        if (
            firebaseErro.code ===
            "permission-denied"
        ) {

            erro.innerText =
                "O Firebase recusou o registro do pedido. Verifique as regras do Firestore.";

        }

        else if (
            firebaseErro.code ===
            "unavailable"
        ) {

            erro.innerText =
                "O Firebase está temporariamente indisponível. Tente novamente.";

        }

        else {

            erro.innerText =
                "Não foi possível registrar seu pedido. Verifique sua conexão e tente novamente.";

        }


        return;

    }


    /* =================================================
       WHATSAPP
       
       O número do pedido NÃO é colocado
       na mensagem.
    ================================================= */

    const total =
        calcularTotal();


    let mensagem =
        "Olá! 👋" +
        "\n" +
        "Quero fazer meu pedido da HOLINESS! 🔥" +
        "\n\n";


    carrinho.forEach(
        function(item) {

            mensagem +=
                "👕 " +
                item.nome +
                "\n" +

                "📏 Tamanho: " +
                item.tamanho +
                "\n" +

                "🔢 Quantidade: " +
                item.quantidade +
                "\n" +

                "💰 " +
                dinheiro(
                    item.preco *
                    item.quantidade
                ) +
                "\n\n";

        }
    );


    mensagem +=
        "💳 Pagamento: " +
        pagamentoSelecionado;


    mensagem +=
        "\n💰 Total: " +
        dinheiro(total);


    if (
        descontoAtual > 0
    ) {

        mensagem +=
            "\n🏷️ Desconto: " +
            descontoAtual +
            "%";

    }


    if (
        cupomAtual !== ""
    ) {

        mensagem +=
            "\n🎟️ Cupom: " +
            cupomAtual;

    }


    mensagem +=
        "\n\nQuero finalizar meu pedido! 🙌";


    /* =================================================
       WHATSAPP
    ================================================= */

    const url =
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(
            mensagem
        );


    erro.style.color =
        "#16833b";


    erro.innerText =
        "Pedido registrado! Abrindo o WhatsApp...";


    /*
     * O número #001/#002 etc NÃO está
     * dentro da mensagem.
     */

    window.location.href =
        url;

}

/* =====================================================
