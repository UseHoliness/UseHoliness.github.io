<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HOLINESS — Admin</title>

<link rel="icon"
      type="image/png"
      href="Logo.png">

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {

    background: #f3f1ed;

    color: #111;

    font-family: Arial, sans-serif;

}


/* =====================================================
   LOGIN
===================================================== */

.login-screen {

    position: fixed;

    inset: 0;

    background: #f3f1ed;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 9999;

}


.login-screen.hidden {

    display: none;

}


.login-box {

    width: 100%;

    max-width: 430px;

    background: #fff;

    padding: 45px;

    border: 1px solid #ddd;

    box-shadow:
        0 20px 60px rgba(0,0,0,.08);

}


.login-logo {

    font-family: "Anton", sans-serif;

    font-size: 42px;

    letter-spacing: 1px;

    margin-bottom: 5px;

}


.login-subtitle {

    color: #777;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 35px;

}


.login-label {

    display: block;

    font-family: "Anton", sans-serif;

    font-size: 10px;

    letter-spacing: 1.5px;

    margin-bottom: 8px;

}


.login-input {

    width: 100%;

    height: 50px;

    border: 1px solid #aaa;

    background: #fff;

    padding: 0 14px;

    outline: none;

    margin-bottom: 18px;

    font-size: 14px;

}


.login-input:focus {

    border-color: #000;

}


.login-button {

    width: 100%;

    height: 55px;

    border: none;

    background: #000;

    color: #fff;

    font-family: "Anton", sans-serif;

    letter-spacing: 2px;

    cursor: pointer;

    transition: .2s;

}


.login-button:hover {

    background: #d49a19;

    color: #000;

}


.login-button:disabled {

    opacity: .6;

    cursor: wait;

}


.login-error {

    min-height: 20px;

    margin-top: 15px;

    font-size: 11px;

    color: #b00000;

    line-height: 1.5;

}


/* =====================================================
   ADMIN
===================================================== */

.admin {

    display: none;

}


.admin.active {

    display: block;

}


/* =====================================================
   HEADER
===================================================== */

header {

    height: 75px;

    background: #fff;

    border-bottom: 1px solid #ddd;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 45px;

    position: sticky;

    top: 0;

    z-index: 100;

}


.logo {

    font-family: "Anton", sans-serif;

    font-size: 31px;

    letter-spacing: 1px;

}


.admin-header-right {

    display: flex;

    align-items: center;

    gap: 18px;

}


.admin-user {

    font-size: 10px;

    color: #777;

    letter-spacing: 1px;

}


.logout-button {

    border: 1px solid #aaa;

    background: #fff;

    height: 38px;

    padding: 0 16px;

    cursor: pointer;

    font-family: "Anton", sans-serif;

    font-size: 10px;

    letter-spacing: 1px;

    transition: .2s;

}


.logout-button:hover {

    background: #000;

    color: #fff;

    border-color: #000;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 100%;

    max-width: 1400px;

    margin: auto;

    padding: 60px 45px 80px;

}


/* =====================================================
   TITLE
===================================================== */

.page-title {

    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    margin-bottom: 45px;

}


.page-title small {

    display: block;

    color: #777;

    font-family: "Anton", sans-serif;

    font-size: 11px;

    letter-spacing: 3px;

    margin-bottom: 8px;

}


.page-title h1 {

    font-family: "Anton", sans-serif;

    font-size: 58px;

    font-weight: 400;

}


.refresh-button {

    border: 1px solid #aaa;

    background: #fff;

    height: 42px;

    padding: 0 18px;

    font-family: "Anton", sans-serif;

    font-size: 10px;

    letter-spacing: 1px;

    cursor: pointer;

}


.refresh-button:hover {

    background: #000;

    color: #fff;

}


/* =====================================================
   CARDS
===================================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-bottom: 45px;

}


.stat {

    background: #fff;

    border: 1px solid #ddd;

    padding: 25px;

}


.stat-label {

    font-family: "Anton", sans-serif;

    color: #888;

    font-size: 10px;

    letter-spacing: 2px;

    margin-bottom: 10px;

}


.stat-value {

    font-family: "Anton", sans-serif;

    font-size: 31px;

    font-weight: 400;

}


/* =====================================================
   STATUS
===================================================== */

.status-bar {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 20px;

    font-size: 10px;

    color: #777;

}


.status-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: #16833b;

}


/* =====================================================
   PEDIDOS
===================================================== */

.orders {

    display: flex;

    flex-direction: column;

    gap: 15px;

}


.order {

    background: #fff;

    border: 1px solid #ddd;

    overflow: hidden;

}


.order-header {

    min-height: 75px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 18px 25px;

    border-bottom: 1px solid #eee;

    cursor: pointer;

}


.order-header:hover {

    background: #fafafa;

}


.order-number {

    font-family: "Anton", sans-serif;

    font-size: 25px;

}


.order-date {

    color: #777;

    font-size: 10px;

    margin-top: 4px;

}


.order-right {

    display: flex;

    align-items: center;

    gap: 20px;

}


.order-total {

    font-family: "Anton", sans-serif;

    font-size: 21px;

}


.order-status {

    font-size: 9px;

    padding: 7px 10px;

    background: #eee;

    letter-spacing: 1px;

}


.order-status.confirmado {

    background: #e2f3e8;

    color: #16833b;

}


.order-status.pendente {

    background: #fff3d6;

    color: #9b6800;

}


/* =====================================================
   DETALHES
===================================================== */

.order-details {

    display: none;

    padding: 25px;

    background: #faf9f7;

}


.order.open .order-details {

    display: block;

}


.detail-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;

    margin-bottom: 25px;

}


.detail-box {

    background: #fff;

    border: 1px solid #e5e5e5;

    padding: 18px;

}


.detail-label {

    font-family: "Anton", sans-serif;

    font-size: 9px;

    color: #888;

    letter-spacing: 1.5px;

    margin-bottom: 7px;

}


.detail-value {

    font-size: 13px;

}


/* =====================================================
   ITENS
===================================================== */

.items-title {

    font-family: "Anton", sans-serif;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 10px;

}


.order-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 15px;

    background: #fff;

    border: 1px solid #e5e5e5;

    margin-bottom: 7px;

}


.item-name {

    font-family: "Anton", sans-serif;

    font-size: 18px;

}


.item-info {

    color: #777;

    font-size: 10px;

    margin-top: 4px;

}


.item-price {

    font-family: "Anton", sans-serif;

    font-size: 17px;

}


/* =====================================================
   RESUMO
===================================================== */

.summary {

    max-width: 420px;

    margin-left: auto;

    margin-top: 20px;

}


.summary-row {

    display: flex;

    justify-content: space-between;

    padding: 8px 0;

    color: #666;

    font-size: 12px;

}


.summary-row.discount {

    color: #16833b;

}


.summary-row.total {

    border-top: 1px solid #ccc;

    margin-top: 7px;

    padding-top: 15px;

    color: #111;

    font-family: "Anton", sans-serif;

    font-size: 21px;

}


/* =====================================================
   VAZIO
===================================================== */

.empty-orders {

    background: #fff;

    border: 1px solid #ddd;

    padding: 80px 20px;

    text-align: center;

    color: #777;

}


.empty-orders strong {

    display: block;

    font-family: "Anton", sans-serif;

    color: #111;

    font-size: 25px;

    margin-bottom: 10px;

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    background: #fff;

    border: 1px solid #ddd;

    padding: 50px;

    text-align: center;

    font-family: "Anton", sans-serif;

    letter-spacing: 2px;

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 900px) {

    header {

        padding: 0 20px;

    }


    .admin-user {

        display: none;

    }


    .container {

        padding: 40px 20px 60px;

    }


    .stats {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .detail-grid {

        grid-template-columns: 1fr;

    }


    .page-title {

        align-items: flex-start;

        gap: 20px;

        flex-direction: column;

    }

}


@media (max-width: 600px) {

    .login-box {

        padding: 30px 25px;

    }


    .login-logo {

        font-size: 36px;

    }


    header {

        height: 65px;

    }


    .logo {

        font-size: 25px;

    }


    .logout-button {

        padding: 0 10px;

    }


    .container {

        padding: 30px 15px 50px;

    }


    .page-title h1 {

        font-size: 43px;

    }


    .stats {

        grid-template-columns: 1fr 1fr;

        gap: 8px;

    }


    .stat {

        padding: 18px;

    }


    .stat-value {

        font-size: 24px;

    }


    .order-header {

        padding: 15px;

    }


    .order-right {

        gap: 8px;

    }


    .order-total {

        font-size: 17px;

    }


    .order-status {

        display: none;

    }


    .order-details {

        padding: 15px;

    }


    .order-item {

        align-items: flex-start;

        gap: 10px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen" class="login-screen">

    <div class="login-box">

        <div class="login-logo">
            HOLINESS
        </div>

        <div class="login-subtitle">
            PAINEL ADMINISTRATIVO
        </div>


        <form id="loginForm">

            <label class="login-label">
                E-MAIL
            </label>

            <input
                id="email"
                class="login-input"
                type="email"
                placeholder="admin@email.com"
                autocomplete="email"
                required
            >


            <label class="login-label">
                SENHA
            </label>

            <input
                id="password"
                class="login-input"
                type="password"
                placeholder="Sua senha"
                autocomplete="current-password"
                required
            >


            <button
                id="loginButton"
                class="login-button"
                type="submit"
            >
                ENTRAR NO PAINEL →
            </button>


            <div
                id="loginError"
                class="login-error"
            ></div>

        </form>

    </div>

</div>


<!-- =====================================================
     ADMIN
===================================================== -->

<div id="admin" class="admin">


<header>

    <div class="logo">
        HOLINESS
    </div>


    <div class="admin-header-right">

        <div
            id="adminUser"
            class="admin-user"
        ></div>


        <button
            id="logoutButton"
            class="logout-button"
        >
            SAIR
        </button>

    </div>

</header>


<main class="container">


    <div class="page-title">

        <div>

            <small>
                ADMINISTRAÇÃO
            </small>

            <h1>
                PEDIDOS
            </h1>

        </div>


        <button
            id="refreshButton"
            class="refresh-button"
        >
            ↻ ATUALIZAR
        </button>

    </div>


    <!-- =================================================
         ESTATÍSTICAS
    ================================================== -->

    <div class="stats">

        <div class="stat">

            <div class="stat-label">
                PEDIDOS
            </div>

            <div
                id="statOrders"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                CAMISAS
            </div>

            <div
                id="statProducts"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                FATURAMENTO
            </div>

            <div
                id="statRevenue"
                class="stat-value"
            >
                R$ 0,00
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                TICKET MÉDIO
            </div>

            <div
                id="statAverage"
                class="stat-value"
            >
                R$ 0,00
            </div>

        </div>

    </div>


    <div class="status-bar">

        <span class="status-dot"></span>

        <span>
            Pedidos sincronizados em tempo real
        </span>

    </div>


    <!-- =================================================
         PEDIDOS
    ================================================== -->

    <div
        id="orders"
        class="orders"
    >

        <div class="loading">
            CARREGANDO PEDIDOS...
        </div>

    </div>


</main>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE APP
===================================================== */

import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


/* =====================================================
   FIREBASE AUTH
===================================================== */

import {

    getAuth,

    signInWithEmailAndPassword,

    onAuthStateChanged,

    signOut

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   FIRESTORE
===================================================== */

import {

    getFirestore,

    collection,

    query,

    orderBy,

    onSnapshot

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIGURAÇÃO FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyADRjI5WbLWECkPk9AKDkpnzJQD82fLjFg",

    authDomain:
        "holiness-e6ec3.firebaseapp.com",

    projectId:
        "holiness-e6ec3",

    storageBucket:
        "holiness-e6ec3.firebasestorage.app",

    messagingSenderId:
        "842822716544",

    appId:
        "1:842822716544:web:d24b1835fa9f4289ce2a65",

    measurementId:
        "G-ZTL2W77QFT"

};


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =====================================================
   ELEMENTOS
===================================================== */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );


const admin =
    document.getElementById(
        "admin"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const adminUser =
    document.getElementById(
        "adminUser"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


const refreshButton =
    document.getElementById(
        "refreshButton"
    );


const ordersContainer =
    document.getElementById(
        "orders"
    );


/* =====================================================
   VARIÁVEIS
===================================================== */

let pedidos = [];

let cancelarPedidosListener = null;


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(valor) {

    return "R$ " +

        Number(valor || 0)

            .toFixed(2)

            .replace(".", ",");

}


/* =====================================================
   DATA
===================================================== */

function formatarData(timestamp) {

    if (!timestamp) {

        return "Data não disponível";

    }


    try {

        const data =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(timestamp);


        return data.toLocaleString(
            "pt-BR",
            {

                day: "2-digit",

                month: "2-digit",

                year: "numeric",

                hour: "2-digit",

                minute: "2-digit"

            }
        );

    }

    catch (erro) {

        return "Data não disponível";

    }

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        loginError.innerText = "";


        if (!email || !password) {

            loginError.innerText =
                "Preencha o e-mail e a senha.";

            return;

        }


        loginButton.disabled = true;

        loginButton.innerText =
            "ENTRANDO...";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        }

        catch (erro) {

            console.error(
                "Erro de login:",
                erro
            );


            if (
                erro.code ===
                "auth/invalid-credential"
            ) {

                loginError.innerText =
                    "E-mail ou senha incorretos.";

            }

            else if (
                erro.code ===
                "auth/user-not-found"
            ) {

                loginError.innerText =
                    "Usuário não encontrado.";

            }

            else if (
                erro.code ===
                "auth/wrong-password"
            ) {

                loginError.innerText =
                    "Senha incorreta.";

            }

            else if (
                erro.code ===
                "auth/too-many-requests"
            ) {

                loginError.innerText =
                    "Muitas tentativas. Tente novamente mais tarde.";

            }

            else {

                loginError.innerText =
                    "Não foi possível entrar. Verifique sua conexão.";

            }

        }

        finally {

            loginButton.disabled = false;

            loginButton.innerText =
                "ENTRAR NO PAINEL →";

        }

    }
);


/* =====================================================
   OBSERVAR LOGIN
===================================================== */

onAuthStateChanged(
    auth,
    function(user) {

        if (user) {

            /* ===============================
               USUÁRIO LOGADO
            =============================== */

            loginScreen.classList.add(
                "hidden"
            );


            admin.classList.add(
                "active"
            );


            adminUser.innerText =
                user.email || "";


            iniciarPedidos();


        }

        else {

            /* ===============================
               SEM LOGIN
            =============================== */

            loginScreen.classList.remove(
                "hidden"
            );


            admin.classList.remove(
                "active"
            );


            if (
                cancelarPedidosListener
            ) {

                cancelarPedidosListener();

                cancelarPedidosListener =
                    null;

            }

        }

    }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async function() {

        try {

            await signOut(auth);

        }

        catch (erro) {

            console.error(
                "Erro ao sair:",
                erro
            );

        }

    }
);


/* =====================================================
   CARREGAR PEDIDOS
===================================================== */

function iniciarPedidos() {

    if (
        cancelarPedidosListener
    ) {

        cancelarPedidosListener();

    }


    ordersContainer.innerHTML =
        '<div class="loading">' +
        'CARREGANDO PEDIDOS...' +
        '</div>';


    /*
     * O sistema tenta ordenar pelo
     * campo numeroPedido.
     *
     * Se os seus documentos já possuem
     * numeroPedido, eles serão organizados
     * corretamente.
     */


    const pedidosRef =
        collection(
            db,
            "pedidos"
        );


    const pedidosQuery =
        query(
            pedidosRef,
            orderBy(
                "numeroPedido",
                "desc"
            )
        );


    cancelarPedidosListener =
        onSnapshot(

            pedidosQuery,

            function(snapshot) {

                pedidos = [];


                snapshot.forEach(
                    function(docSnapshot) {

                        pedidos.push({

                            id:
                                docSnapshot.id,

                            ...docSnapshot.data()

                        });

                    }
                );


                renderizarPedidos();

            },

            function(erro) {

                console.error(
                    "Erro ao carregar pedidos:",
                    erro
                );


                /*
                 * Caso algum pedido antigo
                 * não possua numeroPedido,
                 * tentamos carregar sem
                 * orderBy.
                 */

                carregarPedidosSemOrdenacao();

            }

        );

}


/* =====================================================
   FALLBACK
===================================================== */

function carregarPedidosSemOrdenacao() {

    if (
        cancelarPedidosListener
    ) {

        cancelarPedidosListener();

        cancelarPedidosListener =
            null;

    }


    const pedidosRef =
        collection(
            db,
            "pedidos"
        );


    cancelarPedidosListener =
        onSnapshot(

            pedidosRef,

            function(snapshot) {

                pedidos = [];


                snapshot.forEach(
                    function(docSnapshot) {

                        pedidos.push({

                            id:
                                docSnapshot.id,

                            ...docSnapshot.data()

                        });

                    }
                );


                /*
                 * Ordena no navegador.
                 */

                pedidos.sort(
                    function(a, b) {

                        const numeroA =
                            Number(
                                a.numeroPedido ||
                                a.numero ||
                                0
                            );


                        const numeroB =
                            Number(
                                b.numeroPedido ||
                                b.numero ||
                                0
                            );


                        return numeroB - numeroA;

                    }
                );


                renderizarPedidos();

            },

            function(erro) {

                console.error(
                    "Erro ao carregar pedidos:",
                    erro
                );


                ordersContainer.innerHTML =

                    '<div class="empty-orders">' +

                    '<strong>ERRO AO CARREGAR</strong>' +

                    'Não foi possível acessar os pedidos.' +

                    '<br><br>' +

                    'Verifique as regras do Firestore.' +

                    '</div>';

            }

        );

}


/* =====================================================
   NÚMERO DO PEDIDO
===================================================== */

function numeroPedido(pedido, index) {

    let numero =
        pedido.numeroPedido;


    if (
        numero === undefined ||
        numero === null
    ) {

        numero =
            pedido.numero;

    }


    if (
        numero !== undefined &&
        numero !== null &&
        numero !== ""
    ) {

        const numeroString =
            String(numero);


        /*
         * Se já vier como #001,
         * mantém.
         */

        if (
            numeroString.startsWith("#")
        ) {

            return numeroString;

        }


        return "#" +
            String(numero)
                .padStart(3, "0");

    }


    /*
     * Fallback para pedidos antigos.
     */

    return "#" +
        String(
            pedidos.length - index
        ).padStart(3, "0");

}


/* =====================================================
   STATUS
===================================================== */

function statusPedido(pedido) {

    const status =
        String(
            pedido.status ||
            "aguardando_confirmacao"
        ).toLowerCase();


    if (
        status.includes("confirm")
    ) {

        return {

            texto: "CONFIRMADO",

            classe: "confirmado"

        };

    }


    return {

        texto: "AGUARDANDO",

        classe: "pendente"

    };

}


/* =====================================================
   RENDERIZAR PEDIDOS
===================================================== */

function renderizarPedidos() {

    atualizarEstatisticas();


    if (
        pedidos.length === 0
    ) {

        ordersContainer.innerHTML =

            '<div class="empty-orders">' +

            '<strong>NENHUM PEDIDO AINDA</strong>' +

            'Quando um cliente fizer um pedido,' +

            '<br>' +

            'ele aparecerá aqui automaticamente.' +

            '</div>';

        return;

    }


    ordersContainer.innerHTML = "";


    pedidos.forEach(
        function(pedido, index) {

            const numero =
                numeroPedido(
                    pedido,
                    index
                );


            const status =
                statusPedido(
                    pedido
                );


            const total =
                Number(
                    pedido.total || 0
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "order";


            const itens =
                Array.isArray(
                    pedido.itens
                )
                    ? pedido.itens
                    : [];


            let itensHTML = "";


            if (
                itens.length === 0
            ) {

                itensHTML =

                    '<div class="order-item">' +

                    '<div>' +

                    '<div class="item-name">' +
                    'Pedido' +
                    '</div>' +

                    '<div class="item-info">' +
                    'Nenhum item informado' +
                    '</div>' +

                    '</div>' +

                    '</div>';

            }

            else {

                itens.forEach(
                    function(item) {

                        const quantidade =
                            Number(
                                item.quantidade || 0
                            );


                        const preco =
                            Number(
                                item.subtotal ||
                                (
                                    Number(
                                        item.precoUnitario ||
                                        0
                                    ) *
                                    quantidade
                                )
                            );


                        itensHTML +=

                            '<div class="order-item">' +

                            '<div>' +

                            '<div class="item-name">' +

                            escapeHTML(
                                item.produto ||
                                "Produto"
                            ) +

                            '</div>' +

                            '<div class="item-info">' +

                            'Tamanho: ' +

                            escapeHTML(
                                item.tamanho ||
                                "-"
                            ) +

                            ' · Quantidade: ' +

                            quantidade +

                            '</div>' +

                            '</div>' +

                            '<div class="item-price">' +

                            dinheiro(preco) +

                            '</div>' +

                            '</div>';

                    }
                );

            }


            const subtotal =
                Number(
                    pedido.subtotal || 0
                );


            const desconto =
                Number(
                    pedido.desconto || 0
                );


            const cupom =
                pedido.cupom ||
                "";


            const pagamento =
                pedido.pagamento ||
                "Não informado";


            const data =
                formatarData(
                    pedido.criadoEm
                );


            div.innerHTML =

                '<div class="order-header">' +

                    '<div>' +

                        '<div class="order-number">' +

                            escapeHTML(
                                numero
                            ) +

                        '</div>' +

                        '<div class="order-date">' +

                            data +

                        '</div>' +

                    '</div>' +


                    '<div class="order-right">' +

                        '<div class="order-status ' +
                        status.classe +
                        '">' +

                            status.texto +

                        '</div>' +

                        '<div class="order-total">' +

                            dinheiro(total) +

                        '</div>' +

                    '</div>' +

                '</div>' +


                '<div class="order-details">' +

                    '<div class="detail-grid">' +

                        '<div class="detail-box">' +

                            '<div class="detail-label">' +
                            'PAGAMENTO' +
                            '</div>' +

                            '<div class="detail-value">' +

                                escapeHTML(
                                    pagamento
                                ) +

                            '</div>' +

                        '</div>' +


                        '<div class="detail-box">' +

                            '<div class="detail-label">' +
                            'CUPOM' +
                            '</div>' +

                            '<div class="detail-value">' +

                                (
                                    cupom
                                        ? escapeHTML(cupom)
                                        : "Nenhum"
                                ) +

                            '</div>' +

                        '</div>' +


                        '<div class="detail-box">' +

                            '<div class="detail-label">' +
                            'DOCUMENTO FIREBASE' +
                            '</div>' +

                            '<div class="detail-value">' +

                                escapeHTML(
                                    pedido.id
                                ) +

                            '</div>' +

                        '</div>' +

                    '</div>' +


                    '<div class="items-title">' +
                    'ITENS DO PEDIDO' +
                    '</div>' +

                    itensHTML +


                    '<div class="summary">' +

                        '<div class="summary-row">' +

                            '<span>Subtotal</span>' +

                            '<strong>' +

                                dinheiro(
                                    subtotal
                                ) +

                            '</strong>' +

                        '</div>' +


                        (
                            desconto > 0

                            ?

                            '<div class="summary-row discount">' +

                                '<span>' +

                                    'Desconto (' +
                                    desconto +
                                    '%)' +

                                '</span>' +

                                '<strong>' +

                                    dinheiro(
                                        subtotal -
                                        total
                                    ) +

                                '</strong>' +

                            '</div>'

                            :

                            ''
                        ) +


                        '<div class="summary-row total">' +

                            '<span>TOTAL</span>' +

                            '<strong>' +

                                dinheiro(total) +

                            '</strong>' +

                        '</div>' +

                    '</div>' +

                '</div>';


            const header =
                div.querySelector(
                    ".order-header"
                );


            header.addEventListener(
                "click",
                function() {

                    div.classList.toggle(
                        "open"
                    );

                }
            );


            ordersContainer.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   ESTATÍSTICAS
===================================================== */

function atualizarEstatisticas() {

    let totalCamisas = 0;

    let faturamento = 0;


    pedidos.forEach(
        function(pedido) {

            faturamento +=
                Number(
                    pedido.total || 0
                );


            const itens =
                Array.isArray(
                    pedido.itens
                )
                    ? pedido.itens
                    : [];


            itens.forEach(
                function(item) {

                    totalCamisas +=
                        Number(
                            item.quantidade || 0
                        );

                }
            );

        }
    );


    const quantidadePedidos =
        pedidos.length;


    const ticketMedio =
        quantidadePedidos > 0

            ?

            faturamento /
            quantidadePedidos

            :

            0;


    document.getElementById(
        "statOrders"
    ).innerText =
        quantidadePedidos;


    document.getElementById(
        "statProducts"
    ).innerText =
        totalCamisas;


    document.getElementById(
        "statRevenue"
    ).innerText =
        dinheiro(faturamento);


    document.getElementById(
        "statAverage"
    ).innerText =
        dinheiro(ticketMedio);

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(valor) {

    return String(valor || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ATUALIZAR
===================================================== */

refreshButton.addEventListener(
    "click",
    function() {

        iniciarPedidos();

    }
);


/* =====================================================
   FIM
===================================================== */

</script>
