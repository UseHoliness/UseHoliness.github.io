<link

<link

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    background: #f3f1ed;

    color: #111;

    font-family: Arial, sans-serif;

}


/* =====================================================
   LOGIN
===================================================== */

#loginScreen {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: #f3f1ed;

}

.login-box {

    width: 100%;

    max-width: 420px;

    background: #fff;

    padding: 45px;

    border: 1px solid #ddd;

}

.login-logo {

    font-family: "Anton", sans-serif;

    font-size: 42px;

    letter-spacing: 1px;

    margin-bottom: 5px;

}

.login-subtitle {

    color: #888;

    font-size: 10px;

    letter-spacing: 3px;

    margin-bottom: 35px;

}

.login-label {

    display: block;

    font-family: "Anton", sans-serif;

    font-size: 10px;

    letter-spacing: 2px;

    margin-bottom: 8px;

}

.login-input {

    width: 100%;

    height: 50px;

    border: 1px solid #aaa;

    outline: none;

    padding: 0 15px;

    margin-bottom: 18px;

    font-size: 14px;

}

.login-input:focus {

    border-color: #000;

}

.login-button {

    width: 100%;

    height: 55px;

    border: none;

    background: #000;

    color: #fff;

    font-family: "Anton", sans-serif;

    letter-spacing: 2px;

    cursor: pointer;

    transition: .2s;

}

.login-button:hover {

    background: #d49a19;

    color: #000;

}

.login-error {

    min-height: 20px;

    margin-top: 15px;

    color: #b00000;

    font-size: 11px;

    line-height: 1.5;

}


/* =====================================================
   ADMIN
===================================================== */

#adminScreen {

    display: none;

    min-height: 100vh;

}


/* =====================================================
   HEADER
===================================================== */

.admin-header {

    height: 75px;

    background: #fff;

    border-bottom: 1px solid #ddd;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 45px;

    position: sticky;

    top: 0;

    z-index: 100;

}

.admin-logo {

    font-family: "Anton", sans-serif;

    font-size: 30px;

    letter-spacing: 1px;

}

.admin-logo span {

    color: #999;

    font-size: 11px;

    letter-spacing: 3px;

    margin-left: 10px;

}

.logout-button {

    border: 1px solid #aaa;

    background: #fff;

    padding: 11px 18px;

    font-family: "Anton", sans-serif;

    font-size: 10px;

    letter-spacing: 1.5px;

    cursor: pointer;

}

.logout-button:hover {

    background: #000;

    color: #fff;

    border-color: #000;

}


/* =====================================================
   CONTAINER
===================================================== */

.admin-container {

    width: 100%;

    max-width: 1400px;

    margin: 0 auto;

    padding: 55px 40px 80px;

}


/* =====================================================
   TITULO
===================================================== */

.page-title {

}

.page-title span {

    color: #888;

    font-family: "Anton", sans-serif;

    font-size: 11px;

    letter-spacing: 3px;

}

.page-title h1 {

    font-family: "Anton", sans-serif;

    font-size: 55px;

    font-weight: 400;

}


/* =====================================================
   CARDS
===================================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 18px;

    margin-bottom: 55px;

}

.stat-card {

    background: #fff;

    border: 1px solid #ddd;

    padding: 25px;

}

.stat-label {

    font-family: "Anton", sans-serif;

    font-size: 10px;

    letter-spacing: 2px;

    color: #888;

    margin-bottom: 10px;

}

.stat-value {

    font-family: "Anton", sans-serif;

    font-size: 35px;

}


/* =====================================================
   SEÇÕES
===================================================== */

.section {

    margin-bottom: 65px;

}

.section-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 22px;

}

.section-title {

    font-family: "Anton", sans-serif;

    font-size: 27px;

    font-weight: 400;

}

.refresh-button {

    border: 1px solid #aaa;

    background: #fff;

    padding: 10px 16px;

    font-family: "Anton", sans-serif;

    font-size: 9px;

    letter-spacing: 1.5px;

    cursor: pointer;

}

.refresh-button:hover {

    background: #000;

    color: #fff;

}


/* =====================================================
   ESTOQUE
===================================================== */

.stock-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 25px;

}

.stock-card {

    background: #fff;

    border: 1px solid #ddd;

    padding: 30px;

}

.stock-card-title {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding-bottom: 20px;

    margin-bottom: 20px;

    border-bottom: 1px solid #ddd;

}

.stock-card-title h3 {

    font-family: "Anton", sans-serif;

    font-size: 28px;

    font-weight: 400;

}

.stock-status {

    font-size: 10px;

    color: #777;

}

.stock-list {

    display: grid;

    gap: 10px;

}

.stock-row {

    display: grid;

    grid-template-columns: 55px 1fr 45px 65px 45px;

    gap: 8px;

    align-items: center;

    padding: 10px 0;

    border-bottom: 1px solid #eee;

}

.stock-size {

    font-family: "Anton", sans-serif;

    font-size: 13px;

}

.stock-input {

    width: 100%;

    height: 40px;

    border: 1px solid #aaa;

    background: #fff;

    text-align: center;

    font-weight: bold;

    outline: none;

}

.stock-input:focus {

    border-color: #000;

}

.stock-control {

    width: 40px;

    height: 40px;

    border: 1px solid #aaa;

    background: #fff;

    cursor: pointer;

    font-size: 18px;

}

.stock-control:hover {

    color: #fff;

}

.stock-save {

    height: 50px;

    margin-top: 20px;

    background: #000;

    color: #fff;

    font-family: "Anton", sans-serif;

    cursor: pointer;

}

.stock-save:hover {

    background: #d49a19;

    color: #000;

}

.stock-message {

    margin-top: 10px;

    font-size: 10px;

}


/* =====================================================
   PEDIDOS
===================================================== */

.orders-container {

}

.order-card {

}

}

.order-date {

}

.order-status {

.order-status-select.status-confirmed {

}

.order-status-select.status-cancelled {

}

.order-content {

    padding-top: 20px;

}

.order-items {

    display: grid;

}

.order-item {

    display: flex;

    justify-content: space-between;

    gap: 20px;

    padding: 12px;

    background: #f5f4f1;

}

.order-item-name {

    font-family: "Anton", sans-serif;

    font-size: 16px;

}

.order-item-details {

    color: #777;

    font-size: 10px;

    margin-top: 4px;

}

.order-item-price {

    font-family: "Anton", sans-serif;

}

.order-summary {

    display: flex;

    justify-content: flex-end;

}

.order-total {

    min-width: 240px;

}

.summary-row {

    display: flex;

    justify-content: space-between;

    gap: 30px;

    padding: 5px 0;

    font-size: 11px;

}

.summary-row.discount {

    color: #16833b;

}

.summary-row.total {

    border-top: 1px solid #ddd;

    margin-top: 7px;

    padding-top: 12px;

    font-family: "Anton", sans-serif;

    font-size: 20px;

}

.order-bottom {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    margin-top: 20px;

    padding-top: 18px;

    border-top: 1px solid #ddd;

}

.order-payment {

    font-size: 11px;

    color: #555;

}

.order-actions {

    display: flex;

    gap: 8px;

}

.order-delete {

    border: 1px solid #aaa;

    background: #fff;

    padding: 9px 13px;

    color: #777;

    font-family: "Anton", sans-serif;

    font-size: 9px;

    letter-spacing: 1px;

    cursor: pointer;

}

.order-delete:hover {

    background: #b00000;

    color: #fff;

    border-color: #b00000;

}


/* =====================================================
   VAZIO
===================================================== */

.empty-orders {

    background: #fff;

    border: 1px solid #ddd;

    padding: 60px 30px;

    text-align: center;

    color: #888;

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    background: #fff;

    border: 1px solid #ddd;

    padding: 40px;

    text-align: center;

    color: #888;

    font-size: 12px;

}


/* =====================================================
   TOAST
===================================================== */

.toast {

    position: fixed;

    right: 25px;

    bottom: 25px;

    background: #000;

    color: #fff;

    padding: 16px 20px;

    font-size: 11px;

    z-index: 9999;

    opacity: 0;

    visibility: hidden;

    transform: translateY(15px);

    transition: .25s;

}

.toast.active {

    opacity: 1;

    visibility: visible;

    transform: translateY(0);

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 1000px) {

    .stats {

        grid-template-columns:
            repeat(2, 1fr);

    }

    .stock-grid {

        grid-template-columns: 1fr;

    }

}

@media (max-width: 700px) {

    .admin-header {

        padding: 0 20px;

    }

    .admin-logo span {

        display: none;

    }

    .admin-container {

        padding: 35px 20px 60px;

    }

    .page-title h1 {

        font-size: 43px;

    }

    .stats {

        grid-template-columns: 1fr 1fr;

    }

    .stock-row {

        grid-template-columns:
            45px 1fr 40px 55px 40px;

    }

    .order-top {

        align-items: flex-start;

        flex-direction: column;

    }

    .order-bottom {

        align-items: flex-start;

        flex-direction: column;

    }

    .order-actions {

        width: 100%;

    }

    .order-delete {

        width: 100%;

    }

}

@media (max-width: 450px) {

    .login-box {

        padding: 30px 22px;

    }

    .stats {

        grid-template-columns: 1fr;

    }

    .stock-card {

        padding: 20px;

    }

    .stock-row {

        grid-template-columns:
            40px 1fr 35px 50px 35px;

        gap: 5px;

    }

    .stock-control {

        width: 35px;

    }

}

</style>

</head>

<script type="module">


/* =====================================================
   IMPORTS
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    doc,
    getDoc,
    getDocs,
    onSnapshot,
    setDoc,
    updateDoc,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyADRjI5WbLWECkPk9AKDkpnzJQD82fLjFg",

    authDomain:
        "holiness-e6ec3.firebaseapp.com",

    projectId:
        "holiness-e6ec3",

    storageBucket:
        "holiness-e6ec3.firebasestorage.app",

    messagingSenderId:
        "842822716544",

    appId:
        "1:842822716544:web:d24b1835fa9f4289ce2a65",

    measurementId:
        "G-ZTL2W77QFT"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =====================================================
   CONFIG
===================================================== */

const TAMANHOS = [
    "PP",
    "P",
    "M",
    "G",
    "GG",
    "XG"
];


let pedidos = [];

let unsubscribePedidos = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const adminScreen =
    document.getElementById(
        "adminScreen"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const ordersContainer =
    document.getElementById(
        "ordersContainer"
    );


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(valor) {

    const numero =
        Number(valor) || 0;

    return "R$ " +
        numero
            .toFixed(2)
            .replace(".", ",");

}


/* =====================================================
   DATA
===================================================== */

function formatarData(timestamp) {

    if (!timestamp) {

        return "Data não disponível";

    }


    let data;


    if (
        typeof timestamp.toDate ===
        "function"
    ) {

        data =
            timestamp.toDate();

    }

    else if (
        timestamp.seconds
    ) {

        data =
            new Date(
                timestamp.seconds *
                1000
            );

    }

    else {

        data =
            new Date(timestamp);

    }


    if (
        isNaN(data.getTime())
    ) {

        return "Data não disponível";

    }


    return data.toLocaleString(
        "pt-BR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function mostrarToast(texto) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        texto;


    toast.classList.add(
        "active"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "active"
                );

            },
            2500
        );

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById(
                    "email"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "password"
                )
                .value;


        loginError.innerText =
            "Entrando...";


        loginError.style.color =
            "#777";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            loginError.innerText =
                "";


        } catch (erro) {

            console.error(
                "Erro de login:",
                erro
            );


            loginError.style.color =
                "#b00000";


            if (
                erro.code ===
                "auth/invalid-credential"
            ) {

                loginError.innerText =
                    "E-mail ou senha incorretos.";

            }

            else if (
                erro.code ===
                "auth/too-many-requests"
            ) {

                loginError.innerText =
                    "Muitas tentativas. Aguarde alguns minutos.";

            }

            else {

                loginError.innerText =
                    "Não foi possível entrar. Verifique os dados.";

            }

        }

    }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async function() {

        try {

            await signOut(auth);

        } catch (erro) {

            console.error(
                "Erro ao sair:",
                erro
            );

        }

    }
);


/* =====================================================
   AUTENTICAÇÃO
===================================================== */

onAuthStateChanged(
    auth,
    function(user) {

        if (user) {

            loginScreen.style.display =
                "none";

            adminScreen.style.display =
                "block";


            iniciarPainel();

        }

        else {

            loginScreen.style.display =
                "flex";

            adminScreen.style.display =
                "none";


            if (
                unsubscribePedidos
            ) {

                unsubscribePedidos();

                unsubscribePedidos =
                    null;

            }

        }

    }
);


/* =====================================================
   INICIAR PAINEL
===================================================== */

function iniciarPainel() {

    carregarEstoque();

    observarPedidos();

}


/* =====================================================
   ESTOQUE
===================================================== */

async function carregarEstoque() {

    try {

        const glorySnap =
            await getDoc(
                doc(
                    db,
                    "estoque",
                    "Glory"
                )
            );


        const frassatiSnap =
            await getDoc(
                doc(
                    db,
                    "estoque",
                    "Frassati"
                )
            );


        let glory = {

            PP: 0,
            P: 0,
            M: 0,
            G: 0,
            GG: 0,
            XG: 0

        };


        let frassati = {

            PP: 0,
            P: 0,
            M: 0,
            G: 0,
            GG: 0,
            XG: 0

        };


        if (
            glorySnap.exists()
        ) {

            const dados =
                glorySnap.data();


            TAMANHOS.forEach(
                function(tamanho) {

                    glory[tamanho] =
                        Number(
                            dados[tamanho]
                        ) || 0;

                }
            );

        }


        if (
            frassatiSnap.exists()
        ) {

            const dados =
                frassatiSnap.data();


            TAMANHOS.forEach(
                function(tamanho) {

                    frassati[tamanho] =
                        Number(
                            dados[tamanho]
                        ) || 0;

                }
            );

        }


        renderizarEstoque(
            "Glory",
            glory
        );


        renderizarEstoque(
            "Frassati",
            frassati
        );


        atualizarEstoqueTotal(
            glory,
            frassati
        );


    } catch (erro) {

        console.error(
            "Erro ao carregar estoque:",
            erro
        );


        mostrarToast(
            "Erro ao carregar estoque."
        );

    }

}


/* =====================================================
   RENDERIZAR ESTOQUE
===================================================== */

function renderizarEstoque(
    produto,
    estoque
) {

    const id =
        produto.toLowerCase() +
        "StockList";


    const container =
        document.getElementById(
            id
        );


    if (!container) {

        return;

    }


    container.innerHTML = "";


    let total = 0;


    TAMANHOS.forEach(
        function(tamanho) {

            const quantidade =
                Number(
                    estoque[tamanho]
                ) || 0;


            total += quantidade;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "stock-row";


            row.innerHTML =

                '<span class="stock-size">' +
                tamanho +
                '</span>' +

                '<input ' +
                'class="stock-input" ' +
                'type="number" ' +
                'min="0" ' +
                'value="' +
                quantidade +
                '" ' +
                'id="' +
                produto +
                '-' +
                tamanho +
                '">' +

                '<button ' +
                'class="stock-control" ' +
                'type="button" ' +
                'data-action="minus">' +
                '−' +
                '</button>' +

                '<button ' +
                'class="stock-control" ' +
                'type="button" ' +
                'data-action="plus">' +
                '+' +
                '</button>' +

                '<span></span>';


            const input =
                row.querySelector(
                    ".stock-input"
                );


            const buttons =
                row.querySelectorAll(
                    ".stock-control"
                );


            buttons[0].addEventListener(
                "click",
                function() {

                    let valor =
                        Number(
                            input.value
                        ) || 0;


                    valor =
                        Math.max(
                            0,
                            valor - 1
                        );


                    input.value =
                        valor;

                }
            );


            buttons[1].addEventListener(
                "click",
                function() {

                    let valor =
                        Number(
                            input.value
                        ) || 0;


                    input.value =
                        valor + 1;

                }
            );


            container.appendChild(
                row
            );

        }
    );


    const status =
        document.getElementById(
            produto.toLowerCase() +
            "StockStatus"
        );


    if (status) {

        status.innerText =
            total +
            " unidades";

    }

}


/* =====================================================
   SALVAR ESTOQUE
===================================================== */

window.salvarEstoque =
    async function(produto) {

        const dados = {};


        TAMANHOS.forEach(
            function(tamanho) {

                const input =
                    document.getElementById(
                        produto +
                        "-" +
                        tamanho
                    );


                let valor =
                    Number(
                        input.value
                    );


                if (
                    !Number.isFinite(valor) ||
                    valor < 0
                ) {

                    valor = 0;

                }


                valor =
                    Math.floor(valor);


                input.value =
                    valor;


                dados[tamanho] =
                    valor;

            }
        );


        const mensagem =
            document.getElementById(
                produto.toLowerCase() +
                "StockMessage"
            );


        try {

            mensagem.style.color =
                "#777";

            mensagem.innerText =
                "Salvando...";


            await setDoc(

                doc(
                    db,
                    "estoque",
                    produto
                ),

                dados

            );


            mensagem.style.color =
                "#16833b";

            mensagem.innerText =
                "Estoque atualizado com sucesso!";


            mostrarToast(
                "Estoque " +
                produto +
                " atualizado."
            );


            setTimeout(
                function() {

                    mensagem.innerText =
                        "";

                },
                3000
            );


            carregarEstoque();


        } catch (erro) {

            console.error(
                "Erro ao salvar estoque:",
                erro
            );


            mensagem.style.color =
                "#b00000";

            mensagem.innerText =
                "Erro ao salvar. Verifique as regras do Firebase.";

        }

    };


/* =====================================================
   ATUALIZAR ESTOQUE TOTAL
===================================================== */

function atualizarEstoqueTotal(
    glory,
    frassati
) {

    let total = 0;


    TAMANHOS.forEach(
        function(tamanho) {

            total +=
                Number(
                    glory[tamanho]
                ) || 0;


            total +=
                Number(
                    frassati[tamanho]
                ) || 0;

        }
    );


    document.getElementById(
        "statStock"
    ).innerText =
        total;

}


/* =====================================================
   BOTÃO ATUALIZAR ESTOQUE
===================================================== */

document.getElementById(
    "refreshStock"
).addEventListener(
    "click",
    function() {

        carregarEstoque();

        mostrarToast(
            "Estoque atualizado."
        );

    }
);


/* =====================================================
   PEDIDOS EM TEMPO REAL
===================================================== */

function observarPedidos() {

    if (
        unsubscribePedidos
    ) {

        unsubscribePedidos();

    }


    unsubscribePedidos =
        onSnapshot(

            collection(
                db,
                "pedidos"
            ),

            function(snapshot) {

                pedidos = [];


                snapshot.forEach(
                    function(docSnap) {

                        pedidos.push({

                            id:
                                docSnap.id,

                            ...docSnap.data()

                        });

                    }
                );


                ordenarPedidos();

                renderizarPedidos();

                atualizarEstatisticas();

            },

            function(erro) {

                console.error(
                    "Erro ao observar pedidos:",
                    erro
                );


                ordersContainer.innerHTML =

                    '<div class="empty-orders">' +
                    'Não foi possível carregar os pedidos. ' +
                    'Verifique as regras do Firebase.' +
                    '</div>';

            }

        );

}


/* =====================================================
   ORDENAR PEDIDOS
===================================================== */

function ordenarPedidos() {

    pedidos.sort(
        function(a, b) {

            const numeroA =
                extrairNumero(
                    a.numeroPedido ||
                    a.id
                );


            const numeroB =
                extrairNumero(
                    b.numeroPedido ||
                    b.id
                );


            return numeroB -
                numeroA;

        }
    );

}


/* =====================================================
   EXTRAIR NÚMERO
===================================================== */

function extrairNumero(valor) {

    if (!valor) {

        return 0;

    }


    const numero =
        String(valor)
            .replace(
                "#",
                ""
            );


    return Number(numero) || 0;

}


/* =====================================================
   ATUALIZAR STATUS DO PEDIDO
===================================================== */

async function alterarStatusPedido(id, novoStatus, select) {

    if (!id || !novoStatus) {
        return;
    }

    const statusAnterior = select.dataset.statusAnterior || "aguardando_whatsapp";

    select.disabled = true;

    try {

        await updateDoc(
            doc(db, "pedidos", id),
            {
                status: novoStatus,
                statusAtualizadoEm: new Date()
            }
        );

        select.dataset.statusAnterior = novoStatus;
        aplicarClasseStatus(select, novoStatus);
        mostrarToast("Status atualizado com sucesso.");

    } catch (erro) {

        console.error("Erro ao atualizar status:", erro);

        select.value = statusAnterior;
        aplicarClasseStatus(select, statusAnterior);

        alert(
            "Não foi possível atualizar o status. Verifique as regras do Firebase."
        );

    } finally {

        select.disabled = false;

    }

}


function aplicarClasseStatus(select, status) {

    select.classList.remove(
        "status-whatsapp",
        "status-confirmed",
        "status-cancelled"
    );

    if (status === "aguardando_whatsapp") {
        select.classList.add("status-whatsapp");
    }

    else if (status === "pedido_confirmado") {
        select.classList.add("status-confirmed");
    }

    else if (status === "cancelado") {
        select.classList.add("status-cancelled");
    }

}


/* =====================================================
   RENDERIZAR PEDIDOS
===================================================== */

function renderizarPedidos() {

    if (
        pedidos.length === 0
    ) {

        ordersContainer.innerHTML =

            '<div class="empty-orders">' +

            'Nenhum pedido registrado ainda.' +

            '</div>';

        return;

    }


    ordersContainer.innerHTML =
        "";


    pedidos.forEach(
        function(pedido) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order-card";


            const numero =
                pedido.numeroPedido ||
                pedido.id ||
                "—";


            const itens =
                Array.isArray(
                    pedido.itens
                )
                    ? pedido.itens
                    : [];


            let itensHTML = "";


            itens.forEach(
                function(item) {

                    itensHTML +=

                        '<div class="order-item">' +

                        '<div>' +

                        '<div class="order-item-name">' +

                        (item.produto || "Produto") +

                        '</div>' +

                        '<div class="order-item-details">' +

                        'Tamanho: ' +
                        (item.tamanho || "—") +

                        ' • Quantidade: ' +
                        (item.quantidade || 0) +

                        '</div>' +

                        '</div>' +

                        '<div class="order-item-price">' +

                        dinheiro(
                            item.subtotal ||
                            (
                                Number(
                                    item.precoUnitario
                                ) *
                                Number(
                                    item.quantidade
                                )
                            )
                        ) +

                        '</div>' +

                        '</div>';

                }
            );


            if (
                itensHTML === ""
            ) {

                itensHTML =
                    '<div class="order-item">' +
                    '<div class="order-item-details">' +
                    'Nenhum item encontrado.' +
                    '</div>' +
                    '</div>';

            }


            const desconto =
                Number(
                    pedido.desconto
                ) || 0;


            const cupom =
                pedido.cupom ||
                "";


            const subtotal =
                Number(
                    pedido.subtotal
                ) || 0;


            const total =
                Number(
                    pedido.total
                ) || 0;


            const pagamento =
                pedido.pagamento ||
                "Não informado";


            const status =
                pedido.status ||
                "aguardando_confirmacao";


            card.innerHTML =

                '<div class="order-top">' +

                '<div>' +

                '<div class="order-number">' +

                numero +

                '</div>' +

                '<div class="order-date">' +

                formatarData(
                    pedido.criadoEm
                ) +

                '</div>' +

                '</div>' +

                '<select class="order-status-select" data-status-anterior="' +
                escapeHTML(status) +
                '" data-id="' +
                escapeHTML(pedido.id) +
                '">' +

                '<option value="aguardando_whatsapp" ' +
                (status === "aguardando_whatsapp" ? "selected" : "") +
                '>🟡 Aguardando WhatsApp</option>' +

                '<option value="pedido_confirmado" ' +
                (status === "pedido_confirmado" ? "selected" : "") +
                '>🟢 Pedido confirmado</option>' +

                '<option value="cancelado" ' +
                (status === "cancelado" ? "selected" : "") +
                '>🔴 Cancelado</option>' +

                '</select>' +

                '</div>' +


                '<div class="order-content">' +

                '<div class="order-items">' +

                itensHTML +

                '</div>' +


                '<div class="order-summary">' +

                '<div class="order-total">' +

                '<div class="summary-row">' +

                '<span>Subtotal</span>' +

                '<strong>' +

                dinheiro(subtotal) +

                '</strong>' +

                '</div>' +


                (
                    desconto > 0

                    ?

                    '<div class="summary-row discount">' +

                    '<span>Desconto ' +

                    (
                        cupom
                            ? "(" + cupom + ")"
                            : ""
                    ) +

                    '</span>' +

                    '<strong>' +

                    desconto +

                    '%</strong>' +

                    '</div>'

                    :

                    ""
                ) +


                '<div class="summary-row total">' +

                '<span>TOTAL</span>' +

                '<strong>' +

                dinheiro(total) +

                '</strong>' +

                '</div>' +

                '</div>' +

                '</div>' +


                '<div class="order-bottom">' +

                '<div class="order-payment">' +

                'Pagamento: <strong>' +

                pagamento +

                '</strong>' +

                '</div>' +


                '<div class="order-actions">' +

                '<button ' +
                'class="order-delete" ' +
                'data-id="' +
                escapeHTML(
                    pedido.id
                ) +
                '">' +

                'EXCLUIR PEDIDO' +

                '</button>' +

                '</div>' +

                '</div>' +

                '</div>';


            const statusSelect =
                card.querySelector(
                    ".order-status-select"
                );


            aplicarClasseStatus(
                statusSelect,
                status
            );


            statusSelect.addEventListener(
                "change",
                function() {

                    alterarStatusPedido(
                        pedido.id,
                        statusSelect.value,
                        statusSelect
                    );

                }
            );


            const deleteButton =
                card.querySelector(
                    ".order-delete"
                );


            deleteButton.addEventListener(
                "click",
                function() {

                    excluirPedido(
                        pedido.id,
                        numero
                    );

                }
            );


            ordersContainer.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(valor) {

    return String(valor)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   EXCLUIR PEDIDO
===================================================== */

async function excluirPedido(
    id,
    numero
) {

    const confirmar =
        confirm(
            "Tem certeza que deseja excluir o pedido " +
            numero +
            "?\n\nEssa ação não pode ser desfeita."
        );


    if (!confirmar) {

        return;

    }


    try {

        await deleteDoc(
            doc(
                db,
                "pedidos",
                id
            )
        );


        mostrarToast(
            numero +
            " excluído."
        );


    } catch (erro) {

        console.error(
            "Erro ao excluir pedido:",
            erro
        );


        alert(
            "Não foi possível excluir o pedido. Verifique as regras do Firebase."
        );

    }

}


/* =====================================================
   ESTATÍSTICAS
===================================================== */

function atualizarEstatisticas() {

    let faturamento = 0;

    let camisas = 0;


    pedidos.forEach(
        function(pedido) {

            faturamento +=
                Number(
                    pedido.total
                ) || 0;


            if (
                Array.isArray(
                    pedido.itens
                )
            ) {

                pedido.itens.forEach(
                    function(item) {

                        camisas +=
                            Number(
                                item.quantidade
                            ) || 0;

                    }
                );

            }

        }
    );


    document.getElementById(
        "statOrders"
    ).innerText =
        pedidos.length;


    document.getElementById(
        "statRevenue"
    ).innerText =
        dinheiro(
            faturamento
        );


    document.getElementById(
        "statShirts"
    ).innerText =
        camisas;

}


/* =====================================================
   BOTÃO ATUALIZAR PEDIDOS
===================================================== */

document.getElementById(
    "refreshOrders"
).addEventListener(
    "click",
    function() {

        observarPedidos();

        mostrarToast(
            "Pedidos atualizados."
        );

    }
);


</script>
