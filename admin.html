<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOLINESS — Admin</title>

<link rel="icon" type="image/png" href="Logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
    rel="stylesheet"
>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    background: #f3f1ed;

    color: #111;

    font-family: Arial, sans-serif;

}


/* =====================================================
   HEADER
===================================================== */

header {

    height: 80px;

    background: #fff;

    border-bottom: 1px solid #ddd;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 45px;

    position: sticky;

    top: 0;

    z-index: 100;

}

.logo {

    font-family: "Anton", sans-serif;

    font-size: 30px;

    letter-spacing: 1px;

}

.admin-label {

    font-family: "Anton", sans-serif;

    font-size: 12px;

    letter-spacing: 3px;

    color: #777;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 90%;

    max-width: 1400px;

    margin: auto;

    padding: 55px 0 80px;

}


/* =====================================================
   TITULO
===================================================== */

.page-title {

    margin-bottom: 35px;

}

.page-title span {

    font-family: "Anton", sans-serif;

    font-size: 11px;

    letter-spacing: 3px;

    color: #777;

}

.page-title h1 {

    font-family: "Anton", sans-serif;

    font-size: 60px;

    font-weight: 400;

    line-height: 1;

    margin-top: 5px;

}


/* =====================================================
   DASHBOARD
===================================================== */

.dashboard {

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 15px;

    margin-bottom: 40px;

}

.card {

    background: #fff;

    border: 1px solid #ddd;

    padding: 25px;

}

.card-label {

    font-family: "Anton", sans-serif;

    font-size: 10px;

    letter-spacing: 2px;

    color: #777;

    margin-bottom: 10px;

}

.card-value {

    font-family: "Anton", sans-serif;

    font-size: 35px;

    font-weight: 400;

}


/* =====================================================
   BARRA DE CONTROLE
===================================================== */

.controls {

    display: flex;

    gap: 10px;

    margin-bottom: 20px;

    align-items: stretch;

}

.search {

    flex: 1;

}

.search input {

    width: 100%;

    height: 50px;

    border: 1px solid #aaa;

    background: #fff;

    padding: 0 15px;

    outline: none;

    font-size: 13px;

}

.refresh-button {

    width: 150px;

    border: none;

    background: #000;

    color: #fff;

    font-family: "Anton", sans-serif;

    letter-spacing: 1px;

    cursor: pointer;

}

.refresh-button:hover {

    background: #d49a19;

    color: #000;

}


/* =====================================================
   STATUS
===================================================== */

.connection {

    min-height: 25px;

    margin-bottom: 15px;

    font-size: 11px;

    color: #777;

}


/* =====================================================
   PEDIDOS
===================================================== */

.orders {

    display: flex;

    flex-direction: column;

    gap: 12px;

}


/* =====================================================
   PEDIDO
===================================================== */

.order {

    background: #fff;

    border: 1px solid #ddd;

    transition: .2s;

}

.order:hover {

    border-color: #aaa;

}


/* =====================================================
   CABEÇALHO DO PEDIDO
===================================================== */

.order-header {

    min-height: 80px;

    padding: 18px 22px;

    display: grid;

    grid-template-columns:
        130px
        1fr
        150px
        150px
        120px;

    gap: 15px;

    align-items: center;

}

.order-number {

    font-family: "Anton", sans-serif;

    font-size: 25px;

}

.order-info {

    display: flex;

    flex-direction: column;

    gap: 4px;

}

.order-date {

    font-size: 11px;

    color: #777;

}

.order-payment {

    font-family: "Anton", sans-serif;

    font-size: 11px;

    letter-spacing: 1px;

}

.order-total {

    font-family: "Anton", sans-serif;

    font-size: 20px;

}

.view-button {

    height: 38px;

    border: 1px solid #111;

    background: #fff;

    cursor: pointer;

    font-family: "Anton", sans-serif;

    font-size: 10px;

    letter-spacing: 1px;

}

.view-button:hover {

    background: #000;

    color: #fff;

}


/* =====================================================
   DETALHES
===================================================== */

.order-details {

    display: none;

    border-top: 1px solid #ddd;

    padding: 25px;

    background: #faf9f7;

}

.order-details.active {

    display: block;

}


/* =====================================================
   PRODUTOS
===================================================== */

.items-title {

    font-family: "Anton", sans-serif;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 12px;

}

.item {

    background: #fff;

    border: 1px solid #ddd;

    padding: 15px;

    display: grid;

    grid-template-columns:
        1fr
        100px
        100px
        130px;

    gap: 15px;

    align-items: center;

    margin-bottom: 8px;

}

.item-name {

    font-family: "Anton", sans-serif;

    font-size: 18px;

}

.item-info {

    font-size: 11px;

    color: #666;

}

.item-quantity {

    font-size: 12px;

}

.item-price {

    font-family: "Anton", sans-serif;

    font-size: 16px;

    text-align: right;

}


/* =====================================================
   RESUMO DO PEDIDO
===================================================== */

.order-summary {

    display: flex;

    justify-content: flex-end;

    margin-top: 20px;

}

.summary-box {

    width: 300px;

}

.summary-row {

    display: flex;

    justify-content: space-between;

    padding: 8px 0;

    font-size: 12px;

    border-bottom: 1px solid #ddd;

}

.summary-row.discount {

    color: #16833b;

}

.summary-row.total {

    border-top: 1px solid #111;

    border-bottom: none;

    font-family: "Anton", sans-serif;

    font-size: 21px;

    margin-top: 5px;

    padding-top: 15px;

}


/* =====================================================
   CUPOM
===================================================== */

.coupon {

    display: inline-block;

    margin-top: 10px;

    padding: 6px 9px;

    background: #eee;

    font-family: "Anton", sans-serif;

    font-size: 9px;

    letter-spacing: 1px;

}


/* =====================================================
   VAZIO
===================================================== */

.empty {

    background: #fff;

    border: 1px solid #ddd;

    padding: 70px 20px;

    text-align: center;

    color: #777;

}

.empty strong {

    display: block;

    font-family: "Anton", sans-serif;

    font-size: 25px;

    color: #111;

    margin-bottom: 8px;

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    background: #fff;

    border: 1px solid #ddd;

    padding: 50px;

    text-align: center;

    font-family: "Anton", sans-serif;

    letter-spacing: 2px;

    color: #777;

}


/* =====================================================
   FOOTER
===================================================== */

footer {

    border-top: 1px solid #ddd;

    padding: 30px 45px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: #777;

    font-size: 10px;

}

.footer-logo {

    font-family: "Anton", sans-serif;

    font-size: 25px;

    color: #111;

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 1000px) {

    .dashboard {

        grid-template-columns:
            repeat(2, 1fr);

    }

    .order-header {

        grid-template-columns:
            100px
            1fr
            120px;

    }

    .order-payment {

        display: none;

    }

    .order-total {

        text-align: right;

    }

    .view-button {

        grid-column: 1 / -1;

    }

}


@media (max-width: 650px) {

    header {

        padding: 0 20px;

    }

    .admin-label {

        font-size: 9px;

    }

    .container {

        width: 92%;

        padding-top: 40px;

    }

    .page-title h1 {

        font-size: 45px;

    }

    .dashboard {

        grid-template-columns: 1fr 1fr;

    }

    .card {

        padding: 18px;

    }

    .card-value {

        font-size: 27px;

    }

    .controls {

        flex-direction: column;

    }

    .refresh-button {

        width: 100%;

        height: 48px;

    }

    .order-header {

        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 12px;

    }

    .order-total {

        text-align: left;

    }

    .view-button {

        grid-column: 1 / -1;

    }

    .item {

        grid-template-columns: 1fr 1fr;

    }

    .item-price {

        text-align: left;

    }

    .order-summary {

        justify-content: stretch;

    }

    .summary-box {

        width: 100%;

    }

    footer {

        flex-direction: column;

        gap: 10px;

        text-align: center;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        HOLINESS
    </div>

    <div class="admin-label">
        PAINEL ADMINISTRATIVO
    </div>

</header>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="container">


    <div class="page-title">

        <span>
            ADMINISTRAÇÃO
        </span>

        <h1>
            PEDIDOS
        </h1>

    </div>


    <!-- =================================================
         DASHBOARD
    ================================================== -->

    <section class="dashboard">


        <div class="card">

            <div class="card-label">
                PEDIDOS
            </div>

            <div
                class="card-value"
                id="totalPedidos"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-label">
                FATURAMENTO
            </div>

            <div
                class="card-value"
                id="faturamento"
            >
                R$ 0,00
            </div>

        </div>


        <div class="card">

            <div class="card-label">
                CAMISAS VENDIDAS
            </div>

            <div
                class="card-value"
                id="totalCamisas"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-label">
                TICKET MÉDIO
            </div>

            <div
                class="card-value"
                id="ticketMedio"
            >
                R$ 0,00
            </div>

        </div>


    </section>


    <!-- =================================================
         CONTROLES
    ================================================== -->

    <section class="controls">

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="BUSCAR POR PEDIDO, PRODUTO, TAMANHO OU CUPOM..."
                oninput="filtrarPedidos()"
            >

        </div>


        <button
            class="refresh-button"
            onclick="carregarPedidosNovamente()"
        >
            ATUALIZAR
        </button>

    </section>


    <div
        id="connection"
        class="connection"
    >
        Conectando ao Firebase...
    </div>


    <!-- =================================================
         PEDIDOS
    ================================================== -->

    <section id="orders">

        <div class="loading">
            CARREGANDO PEDIDOS...
        </div>

    </section>


</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div class="footer-logo">
        HOLINESS
    </div>

    <div>
        PAINEL ADMINISTRATIVO
    </div>

</footer>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =====================================================
   IMPORTS
===================================================== */

import {

    initializeApp

}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getFirestore,

    collection,

    query,

    orderBy,

    onSnapshot

}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIGURAÇÃO FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyADRjI5WbLWECkPk9AKDkpnzJQD82fLjFg",

    authDomain:
        "holiness-e6ec3.firebaseapp.com",

    projectId:
        "holiness-e6ec3",

    storageBucket:
        "holiness-e6ec3.firebasestorage.app",

    messagingSenderId:
        "842822716544",

    appId:
        "1:842822716544:web:d24b1835fa9f4289ce2a65",

    measurementId:
        "G-ZTL2W77QFT"

};


/* =====================================================
   FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


/* =====================================================
   VARIÁVEIS
===================================================== */

let pedidos = [];

let pedidosFiltrados = [];

let unsubscribe = null;


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(valor) {

    valor = Number(valor) || 0;

    return "R$ " +

        valor
            .toFixed(2)
            .replace(".", ",");

}


/* =====================================================
   DATA
===================================================== */

function formatarData(timestamp) {

    if (!timestamp) {

        return "Data não disponível";

    }


    try {

        let data;


        if (
            timestamp.toDate
        ) {

            data =
                timestamp.toDate();

        }

        else if (
            timestamp.seconds
        ) {

            data =
                new Date(
                    timestamp.seconds *
                    1000
                );

        }

        else {

            data =
                new Date(timestamp);

        }


        return data.toLocaleString(
            "pt-BR",
            {

                day: "2-digit",

                month: "2-digit",

                year: "numeric",

                hour: "2-digit",

                minute: "2-digit"

            }
        );

    }

    catch (erro) {

        return "Data inválida";

    }

}


/* =====================================================
   NÚMERO DO PEDIDO
===================================================== */

function numeroPedido(pedido, index) {

    /*
     * Se o documento já tiver
     * numeroPedido, usamos ele.
     */

    if (
        pedido.numeroPedido
    ) {

        return String(
            pedido.numeroPedido
        );

    }


    /*
     * Caso os pedidos antigos não
     * tenham numeroPedido, criamos
     * uma numeração visual baseada
     * na posição.
     *
     * O mais antigo será #001.
     */

    return "#" +
        String(
            pedidos.length - index
        )
        .padStart(3, "0");

}


/* =====================================================
   CARREGAR PEDIDOS
===================================================== */

function carregarPedidos() {

    const connection =
        document.getElementById(
            "connection"
        );


    connection.innerText =
        "Conectado ao Firebase • Atualização em tempo real";


    try {

        const pedidosRef =
            collection(
                db,
                "pedidos"
            );


        /*
         * Tentamos ordenar pela data.
         */

        const pedidosQuery =
            query(
                pedidosRef,
                orderBy(
                    "criadoEm",
                    "desc"
                )
            );


        unsubscribe =
            onSnapshot(

                pedidosQuery,

                function(snapshot) {

                    pedidos =
                        snapshot.docs.map(
                            function(doc) {

                                return {

                                    id:
                                        doc.id,

                                    ...doc.data()

                                };

                            }
                        );


                    pedidosFiltrados =
                        [...pedidos];


                    atualizarDashboard();

                    renderizarPedidos();

                },

                function(erro) {

                    console.error(
                        "Erro Firebase:",
                        erro
                    );


                    /*
                     * Se houver problema
                     * com índice ou ordenação,
                     * tenta buscar sem orderBy.
                     */

                    carregarSemOrdenacao();

                }

            );

    }

    catch (erro) {

        console.error(
            erro
        );

        carregarSemOrdenacao();

    }

}


/* =====================================================
   FALLBACK
===================================================== */

function carregarSemOrdenacao() {

    const pedidosRef =
        collection(
            db,
            "pedidos"
        );


    unsubscribe =
        onSnapshot(

            pedidosRef,

            function(snapshot) {

                pedidos =
                    snapshot.docs.map(
                        function(doc) {

                            return {

                                id:
                                    doc.id,

                                ...doc.data()

                            };

                        }
                    );


                /*
                 * Ordena no navegador
                 */

                pedidos.sort(
                    function(a,b) {

                        const dataA =
                            obterData(a.criadoEm);

                        const dataB =
                            obterData(b.criadoEm);

                        return dataB - dataA;

                    }
                );


                pedidosFiltrados =
                    [...pedidos];


                atualizarDashboard();

                renderizarPedidos();

            },

            function(erro) {

                console.error(
                    erro
                );


                document.getElementById(
                    "connection"
                ).innerText =
                    "Erro ao conectar ao Firebase.";

            }

        );

}


/* =====================================================
   DATA PARA ORDENAÇÃO
===================================================== */

function obterData(timestamp) {

    if (!timestamp) {

        return 0;

    }


    if (
        timestamp.toDate
    ) {

        return timestamp
            .toDate()
            .getTime();

    }


    if (
        timestamp.seconds
    ) {

        return timestamp.seconds *
            1000;

    }


    const data =
        new Date(timestamp);


    return data.getTime() || 0;

}


/* =====================================================
   DASHBOARD
===================================================== */

function atualizarDashboard() {

    let faturamento = 0;

    let camisas = 0;


    pedidos.forEach(
        function(pedido) {

            faturamento +=
                Number(
                    pedido.total
                ) || 0;


            if (
                Array.isArray(
                    pedido.itens
                )
            ) {

                pedido.itens.forEach(
                    function(item) {

                        camisas +=
                            Number(
                                item.quantidade
                            ) || 0;

                    }
                );

            }

        }
    );


    const quantidadePedidos =
        pedidos.length;


    const ticket =
        quantidadePedidos > 0

            ? faturamento /
              quantidadePedidos

            : 0;


    document.getElementById(
        "totalPedidos"
    ).innerText =
        quantidadePedidos;


    document.getElementById(
        "faturamento"
    ).innerText =
        dinheiro(faturamento);


    document.getElementById(
        "totalCamisas"
    ).innerText =
        camisas;


    document.getElementById(
        "ticketMedio"
    ).innerText =
        dinheiro(ticket);

}


/* =====================================================
   RENDERIZAR PEDIDOS
===================================================== */

function renderizarPedidos() {

    const container =
        document.getElementById(
            "orders"
        );


    if (
        pedidosFiltrados.length === 0
    ) {

        container.innerHTML =

            '<div class="empty">' +

            '<strong>NENHUM PEDIDO</strong>' +

            'Não encontramos nenhum pedido.' +

            '</div>';

        return;

    }


    container.innerHTML = "";


    pedidosFiltrados.forEach(
        function(pedido) {

            const index =
                pedidos.indexOf(
                    pedido
                );


            const numero =
                numeroPedido(
                    pedido,
                    index
                );


            const total =
                Number(
                    pedido.total
                ) || 0;


            const pagamento =
                pedido.pagamento ||
                "Não informado";


            const data =
                formatarData(
                    pedido.criadoEm
                );


            const itens =
                Array.isArray(
                    pedido.itens
                )
                    ? pedido.itens
                    : [];


            let quantidadeItens = 0;


            itens.forEach(
                function(item) {

                    quantidadeItens +=
                        Number(
                            item.quantidade
                        ) || 0;

                }
            );


            const order =
                document.createElement(
                    "article"
                );


            order.className =
                "order";


            const header =
                document.createElement(
                    "div"
                );


            header.className =
                "order-header";


            header.innerHTML =

                '<div class="order-number">' +

                numero +

                '</div>' +


                '<div class="order-info">' +

                '<strong>' +

                quantidadeItens +

                (
                    quantidadeItens === 1
                        ? " camisa"
                        : " camisas"
                ) +

                '</strong>' +

                '<span class="order-date">' +

                data +

                '</span>' +

                '</div>' +


                '<div class="order-payment">' +

                pagamento +

                '</div>' +


                '<div class="order-total">' +

                dinheiro(total) +

                '</div>' +


                '<button class="view-button">' +

                'VER DETALHES' +

                '</button>';


            const details =
                document.createElement(
                    "div"
                );


            details.className =
                "order-details";


            details.innerHTML =
                criarDetalhes(
                    pedido,
                    numero
                );


            const button =
                header.querySelector(
                    ".view-button"
                );


            button.addEventListener(
                "click",
                function() {

                    details.classList.toggle(
                        "active"
                    );


                    button.innerText =
                        details.classList.contains(
                            "active"
                        )
                            ? "FECHAR"
                            : "VER DETALHES";

                }
            );


            order.appendChild(
                header
            );


            order.appendChild(
                details
            );


            container.appendChild(
                order
            );

        }
    );

}


/* =====================================================
   DETALHES
===================================================== */

function criarDetalhes(
    pedido,
    numero
) {

    const itens =
        Array.isArray(
            pedido.itens
        )
            ? pedido.itens
            : [];


    let html =

        '<div class="items-title">' +

        'PRODUTOS DO PEDIDO ' +

        numero +

        '</div>';


    if (
        itens.length === 0
    ) {

        html +=

            '<div class="empty">' +

            'Nenhum item encontrado neste pedido.' +

            '</div>';

    }


    itens.forEach(
        function(item) {

            const nome =
                item.produto ||
                "Produto";


            const tamanho =
                item.tamanho ||
                "-";


            const quantidade =
                Number(
                    item.quantidade
                ) || 0;


            const preco =
                Number(
                    item.precoUnitario
                ) || 0;


            const subtotal =
                Number(
                    item.subtotal
                ) ||

                (
                    preco *
                    quantidade
                );


            html +=

                '<div class="item">' +

                '<div>' +

                '<div class="item-name">' +

                nome +

                '</div>' +

                '<div class="item-info">' +

                'Tamanho: ' +

                tamanho +

                '</div>' +

                '</div>' +


                '<div class="item-info">' +

                dinheiro(preco) +

                ' / un.' +

                '</div>' +


                '<div class="item-quantity">' +

                'Qtd: ' +

                quantidade +

                '</div>' +


                '<div class="item-price">' +

                dinheiro(subtotal) +

                '</div>' +

                '</div>';

        }
    );


    const subtotal =
        Number(
            pedido.subtotal
        ) || 0;


    const desconto =
        Number(
            pedido.desconto
        ) || 0;


    const total =
        Number(
            pedido.total
        ) || 0;


    const cupom =
        pedido.cupom ||
        "";


    html +=

        '<div class="order-summary">' +

        '<div class="summary-box">' +


        '<div class="summary-row">' +

        '<span>Subtotal</span>' +

        '<strong>' +

        dinheiro(subtotal) +

        '</strong>' +

        '</div>';


    if (
        desconto > 0
    ) {

        html +=

            '<div class="summary-row discount">' +

            '<span>Desconto</span>' +

            '<strong>' +

            desconto +

            '%</strong>' +

            '</div>';

    }


    if (
        cupom !== ""
    ) {

        html +=

            '<div class="coupon">' +

            'CUPOM: ' +

            cupom +

            '</div>';

    }


    html +=

        '<div class="summary-row total">' +

        '<span>TOTAL</span>' +

        '<strong>' +

        dinheiro(total) +

        '</strong>' +

        '</div>' +


        '</div>' +

        '</div>';


    return html;

}


/* =====================================================
   BUSCA
===================================================== */

function filtrarPedidos() {

    const texto =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    if (!texto) {

        pedidosFiltrados =
            [...pedidos];

        renderizarPedidos();

        return;

    }


    pedidosFiltrados =
        pedidos.filter(
            function(pedido) {

                const index =
                    pedidos.indexOf(
                        pedido
                    );


                const numero =
                    numeroPedido(
                        pedido,
                        index
                    )
                    .toLowerCase();


                const pagamento =
                    (
                        pedido.pagamento ||
                        ""
                    )
                    .toLowerCase();


                const cupom =
                    (
                        pedido.cupom ||
                        ""
                    )
                    .toLowerCase();


                let produtos = "";


                if (
                    Array.isArray(
                        pedido.itens
                    )
                ) {

                    pedido.itens.forEach(
                        function(item) {

                            produtos +=

                                " " +

                                (
                                    item.produto ||
                                    ""
                                ) +

                                " " +

                                (
                                    item.tamanho ||
                                    ""
                                );

                        }
                    );

                }


                produtos =
                    produtos.toLowerCase();


                return (

                    numero.includes(texto) ||

                    pagamento.includes(texto) ||

                    cupom.includes(texto) ||

                    produtos.includes(texto)

                );

            }
        );


    renderizarPedidos();

}


/* =====================================================
   ATUALIZAR MANUALMENTE
===================================================== */

function carregarPedidosNovamente() {

    if (
        unsubscribe
    ) {

        unsubscribe();

    }


    document.getElementById(
        "orders"
    ).innerHTML =

        '<div class="loading">' +

        'ATUALIZANDO...' +

        '</div>';


    carregarPedidos();

}


/* =====================================================
   FUNÇÕES GLOBAIS
===================================================== */

window.filtrarPedidos =
    filtrarPedidos;


window.carregarPedidosNovamente =
    carregarPedidosNovamente;


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

carregarPedidos();


</script>
